<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GazeIT - Visita Culturale</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/gaze-feedback.css">
</head>
<body>


<!-- SCHERMATA DI AVVIO PER SBLOCCARE L'AUDIO (Obbligatoria per i browser) -->
<div id="start-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e1e; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;">
    <h1 style="font-size: 3rem; color: #ff9800; margin-bottom: 20px;">GazeIT</h1>
    <p style="font-size: 1.5rem; color: white;">Clicca in un punto qualsiasi per avviare la visita</p>
</div>

<!-- Header con Istruzioni e Selettore Lingua -->
<header id="app-header">
    <div class="header-left">
        <button id="toggle-ui" class="gaze-clickable icon-btn" aria-label="Nascondi/Mostra interfaccia">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s4-7 11-7c2.1 0 3.9.5 5.4 1.3M22 12s-1.6 2.8-4.4 4.7M12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.6 3.4"></path>
                <path d="M9.5 9.8a3 3 0 0 0 4.2 4.2"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
        </button>

        <!-- Simulazione comando vocale: appare al click destro, in qualsiasi punto dello schermo -->
        <div id="voice-command-panel" class="hidden">
            <div id="voice-command-label">GazeIT in ascolto...</div>
            <div id="voice-command-menu"></div>
        </div>
    </div>

    <div class="header-center ui-hideable">
        <h1>GazeIT</h1>
        <p id="instruction-text">Soffermati per 2 secondi su un elemento per poterci interagire.</p>
    </div>

    <div class="header-right ui-hideable">
        <button id="toggle-audio" class="gaze-clickable icon-btn" aria-label="Attiva/disattiva audio">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9"></polygon>
                <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
                <path d="M19.5 5.5a9 9 0 0 1 0 13"></path>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9"></polygon>
                <line x1="17" y1="9" x2="23" y2="15"></line>
                <line x1="23" y1="9" x2="17" y2="15"></line>
            </svg>
        </button>

        <div id="lang-dropdown" class="dropdown">
            <button id="lang-dropdown-btn" class="gaze-clickable icon-btn flag-btn flag-it" aria-label="Seleziona la lingua"></button>
            <div id="lang-dropdown-content" class="dropdown-content hidden">
                <button class="gaze-clickable icon-btn flag-btn flag-it lang-option" data-lang="it" aria-label="Italiano"></button>
                <button class="gaze-clickable icon-btn flag-btn flag-en lang-option" data-lang="en" aria-label="English"></button>
            </div>
        </div>
    </div>
</header>

<!-- Ambiente della visita virtuale -->
<main id="virtual-environment">
    <!-- Ogni opera è avvolta in un wrapper posizionato: serve da ancora per il pannello descrittivo laterale -->
    <div class="artwork-wrapper" data-id="1">
        <div class="artwork-target" data-id="1">
            <img src="../assets/images/monalisa.jpg" alt="Monalisa" class="artwork-image">
            <div class="artwork-label">Monalisa</div>
            <button class="artwork-info-btn gaze-clickable" aria-label="Informazioni sull'opera">i</button>
        </div>
    </div>

    <div class="artwork-wrapper" data-id="2">
        <div class="artwork-target" data-id="2">
            <img src="../assets/images/nike.jpg" alt="Nike di Samotracia" class="artwork-image">
            <div class="artwork-label">Nike di Samotracia</div>
            <button class="artwork-info-btn gaze-clickable" aria-label="Informazioni sull'opera">i</button>
        </div>
    </div>
</main>

<!-- Pannello con le informazioni dell'opera: viene spostato via JS accanto all'opera aperta -->
<div id="info-modal" class="side-panel">
    <div class="modal-content">
        <h2 id="modal-title">Titolo Opera</h2>
        <img id="modal-image" src="" alt="Immagine Dettaglio">
        <p id="modal-description">Descrizione dell'opera.</p>


    </div>
</div>
<!-- Piccola linea che collega il pannello allo spigolo dell'opera: separata dal pannello per non essere ritagliata dal suo overflow -->
<div id="info-connector"></div>
<div id="global-subtitle-container" class="subtitle-overlay hidden">
    <p id="global-subtitle-text"></p>
</div>
<button id="toggle-subtitles" class="gaze-clickable icon-btn fixed-bottom-right ui-hideable" aria-label="Attiva/disattiva sottotitoli">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="6" y1="10" x2="10" y2="10"></line>
        <line x1="12" y1="10" x2="18" y2="10"></line>
        <line x1="6" y1="14" x2="14" y2="14"></line>
    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="6" y1="10" x2="10" y2="10"></line>
        <line x1="12" y1="10" x2="18" y2="10"></line>
        <line x1="6" y1="14" x2="14" y2="14"></line>
        <line x1="2" y1="2" x2="22" y2="22"></line>
    </svg>
</button>

<!-- Indicatore visivo del cursore/gaze -->
<div id="gaze-cursor">
    <div id="gaze-progress"></div>
</div>

<!-- Audio di Sottofondo (Con i ../ ripristinati) -->
<audio id="background-audio" loop>
    <source src="../assets/audio/audio-ita.mp3" type="audio/mpeg">
    Il tuo browser non supporta l'elemento audio.
</audio>

<!-- Script JavaScript (Con i ../ ripristinati) -->
<script src="../js/mock-data.js"></script>
<script src="../js/gaze-engine.js"></script>
<script src="../js/app.js"></script>

</body>
</html>
